name: CabWatch recovery checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_cab_watch test_retention test_telemetry test_live test_journey
      - run: node --test test_motion.mjs test_telemetry.mjs
      - run: docker compose -p cabwatch-fastapi-test -f compose.yaml -f compose.test.yaml up -d --build
      - run: python -m unittest -v test_schema test_kafka_flow
        env:
          CABWATCH_TEST_DATABASE_URL: postgresql://cabwatch:cabwatch@127.0.0.1:15433/cabwatch
          CABWATCH_KAFKA_TEST_URL: http://127.0.0.1:18082/cab-watch
          CABWATCH_FAULT_TESTS: '1'
      - run: docker compose -p cabwatch-fastapi-test -f compose.yaml -f compose.test.yaml up -d --no-deps dashboard
        env:
          TELEMETRY_MODE: direct
      - run: |
          python - <<'PY'
          import time, httpx
          for _ in range(60):
              try:
                  if httpx.get('http://127.0.0.1:18082/healthz',timeout=2).json().get('telemetry_mode')=='direct': break
              except (httpx.HTTPError,ValueError): pass
              time.sleep(1)
          else: raise RuntimeError('Direct test API unavailable')
          PY
          python -m unittest -v test_account_flow
        env:
          CABWATCH_TEST_URL: http://127.0.0.1:18082/cab-watch
      - if: failure()
        run: docker compose -p cabwatch-fastapi-test -f compose.yaml -f compose.test.yaml logs --tail 150
      - if: always()
        run: docker compose -p cabwatch-fastapi-test -f compose.yaml -f compose.test.yaml down
