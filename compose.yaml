name: cabwatch
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cabwatch
      POSTGRES_USER: cabwatch
      POSTGRES_PASSWORD: cabwatch
    volumes: [cabwatch-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cabwatch"]
      interval: 3s
      timeout: 3s
      retries: 30
  dashboard:
    build: .
    ports: ["127.0.0.1:18080:8080"]
    environment:
      DATABASE_URL: postgresql://cabwatch:cabwatch@db/cabwatch
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRIP_RETENTION_DAYS: ${TRIP_RETENTION_DAYS:-90}
      RETENTION_INTERVAL_HOURS: ${RETENTION_INTERVAL_HOURS:-6}
    depends_on:
      db: {condition: service_healthy}
volumes:
  cabwatch-db: {}


